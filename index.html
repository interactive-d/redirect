<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Message</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    font-family:Arial;
    text-align:center;
    color:white;
    overflow:hidden;
    position:relative;
}

.box{
    padding:40px;
    z-index:2;
}

h1{
    font-size:3rem;
}

p{
    font-size:1.2rem;
    margin-top:20px;
    line-height:1.6;
}

.btn{
    margin-top:20px;
    padding:14px 32px;
    border:none;
    border-radius:40px;
    background:white;
    color:#ff4f81;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.btn:hover{
    transform:scale(1.08);
}

/* CONFETTI */

.confetti{
    position:absolute;
    width:10px;
    height:10px;
    top:-10px;
    opacity:0.8;
    animation:fall linear forwards;
}

@keyframes fall{
    0%{
        transform:translateY(0) rotate(0deg);
    }

    100%{
        transform:translateY(110vh) rotate(720deg);
    }
}

</style>
</head>
<body>

<!-- AUDIO -->
<audio id="bgMusic" loop>
    <source src="song.mp3" type="audio/mp3">
</audio>

<div class="box">

    <h1>Happy Birthday Nikki🎂❤️</h1>

    <p>
        Wishing you endless happiness, smiles, love and beautiful memories.
    </p>

    <!-- PLAY MUSIC BUTTON -->
    <button class="btn" onclick="playMusic()">
        🎵 Hey Listen
    </button>

    <br>

    <!-- NEXT PAGE BUTTON -->
    <button class="btn" onclick="openSurprise()">
        Open Next Surprise ✨
    </button>

</div>

<script>

function playMusic(){

    const music = document.getElementById("bgMusic");
    music.play();

    startConfetti();
}

function openSurprise(){
    window.location.href = "https://nikki-liard.vercel.app/";
}

/* CONFETTI FUNCTION */

function startConfetti(){

    for(let i = 0; i < 120; i++){

        let confetti = document.createElement("div");

        confetti.classList.add("confetti");

        document.body.appendChild(confetti);

        const colors = [
            "#ff0",
            "#fff",
            "#00ffea",
            "#ff4f81",
            "#7dff7d",
            "#ffd700"
        ];

        confetti.style.left = Math.random() * 100 + "vw";

        confetti.style.background =
        colors[Math.floor(Math.random() * colors.length)];

        confetti.style.width =
        confetti.style.height =
        Math.random() * 12 + 5 + "px";

        confetti.style.animationDuration =
        Math.random() * 3 + 3 + "s";

        setTimeout(()=>{
            confetti.remove();
        },6000);
    }
}

</script>

</body>
</html>
